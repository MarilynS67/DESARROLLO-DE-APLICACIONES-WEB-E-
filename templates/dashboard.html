{% extends "base.html" %}

{% block title %}Panel principal{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container">

        <div class="card p-5 shadow-sm text-center">

            <h1 class="mb-3">
                Bienvenido al sistema
            </h1>

            <p class="lead mb-4">
                Hola,
                <strong>{{ current_user.usuario }}</strong>.
            </p>

            <p class="mb-4">
                Has iniciado sesión correctamente en
                <strong>{{ nombre_sistema }}</strong>.
            </p>


            <div class="d-flex justify-content-center gap-2 flex-wrap">

                <a
                    href="{{ url_for('productos') }}"
                    class="btn btn-primary">
                    Productos
                </a>

                <a
                    href="{{ url_for('clientes') }}"
                    class="btn btn-primary">
                    Clientes
                </a>

                <a
                    href="{{ url_for('proveedores') }}"
                    class="btn btn-primary">
                    Proveedores
                </a>

                <a
                    href="{{ url_for('facturacion') }}"
                    class="btn btn-primary">
                    Facturación
                </a>

            </div>


            <div class="mt-4">

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-outline-danger">
                    Cerrar sesión
                </a>

            </div>

        </div>

    </div>
</section>

{% endblock %}
